name: Ansible SSH setup
description: Checks Ansible, installs the SSH key, and creates the inventory file

inputs:
  ssh_private_key:
    description: Ed25519 private key for SSH access
    required: true
  ssh_host:
    description: Remote VM hostname
    required: true
  ssh_user:
    description: Remote VM SSH user
    required: true

runs:
  using: composite
  steps:
    - name: Check Ansible
      shell: bash
      run: ansible --version

    - name: Setup SSH key
      shell: bash
      run: |
        mkdir -p $HOME/.ssh
        echo "${INPUTS_SSH_PRIVATE_KEY}" > $HOME/.ssh/id_ed25519
        chmod 600 $HOME/.ssh/id_ed25519
        ssh-keyscan -H "${INPUTS_SSH_HOST}" >> $HOME/.ssh/known_hosts
      env:
        INPUTS_SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
        INPUTS_SSH_HOST: ${{ inputs.ssh_host }}

    - name: Create Ansible inventory
      shell: bash
      run: |
        echo "[ocis_server]" > ./server/ansible/hosts.ini
        echo "${INPUTS_SSH_HOST} ansible_user=${INPUTS_SSH_USER} ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519" >> ./server/ansible/hosts.ini
      env:
        INPUTS_SSH_HOST: ${{ inputs.ssh_host }}
        INPUTS_SSH_USER: ${{ inputs.ssh_user }}
