name: Create & Provision backend

on:
  workflow_call:
    # Inputs required when this workflow is called by another workflow
    inputs:
      ocis_version:
        description: 'oCIS version to install'
        type: string
        required: true
        default: 'latest'
    # Secrets required when this workflow is called by another workflow
    secrets:
      OCIS_URL:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      OCIS_PWD:
        required: true

  workflow_dispatch:
    # Inputs for manual trigger via GitHub UI
    inputs:
      ocis_version:
        description: 'oCIS version to install'
        type: string
        required: false
        default: 'latest'
      ocis_url:
        description: 'oCIS URL'
        type: string
        required: true

permissions:
  contents: read

jobs:
  create_server:
    name: Create server
    runs-on: ubuntu-latest

    # All environment variables are derived from either secrets (dispatch) or inputs (call)
    env:
      OCIS_VERSION: ${{ inputs.ocis_version }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      OCIS_PWD: ${{ secrets.OCIS_PWD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # If workflow_call secret exists, use it; otherwise use dispatch input
      - name: Set BASE_URL
        run: |
          if [ -n "${{ secrets.OCIS_URL }}" ]; then
            echo "BASE_URL=${{ secrets.OCIS_URL }}" >> $GITHUB_ENV
          else
            echo "BASE_URL=${{ inputs.ocis_url }}" >> $GITHUB_ENV
          fi

      - name: Setup Ansible and SSH
        uses: ./.github/workflows/ansible-setup
        with:
          ssh_private_key: ${{ env.SSH_PRIVATE_KEY }}
          ssh_host: ${{ env.SSH_HOST }}
          ssh_user: ${{ env.SSH_USER }}

      # Navigate to ansible directory and run the OCIS provisioning playbook
      - name: Run provision playbook
        run: |
          cd ./server/ansible
          ansible-playbook -i hosts.ini ocis.yml

