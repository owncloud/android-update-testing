name: Clean up backend

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove_server:
    name: Remove server
    runs-on: ubuntu-latest

    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Ansible and SSH
        uses: ./.github/workflows/ansible-setup
        with:
          ssh_private_key: ${{ env.SSH_PRIVATE_KEY }}
          ssh_host: ${{ env.SSH_HOST }}
          ssh_user: ${{ env.SSH_USER }}

      # Clean up containers and images in the remote server
      - name: Run clean up
        run: |
          cd ./server/ansible
          ansible ocis_server -i hosts.ini -m shell -a \
            'containers=$(docker ps -aq); [ -n "$containers" ] && docker rm -f $containers'
          ansible ocis_server -i hosts.ini -m shell -a \
            'images=$(docker images -aq); [ -n "$images" ] && docker rmi -f $images'


