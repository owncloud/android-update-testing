name: Sign APK

on:
  workflow_call:
    inputs:
      version:
        description: "APK version to sign"
        required: true
        type: string
      unsigned_artifact_name:
        description: "Artifact name produced by the build job"
        required: true
        type: string
    secrets:
      TEST_KS_B64:
        required: true
      TEST_KS_ALIAS:
        required: true
      TEST_KS_KEY:
        required: true

jobs:
  sign:
    name: Align and sign ${{ inputs.version }} APK
    runs-on: ubuntu-latest
    env:
      BUILD_TOOLS_VERSION: "34.0.0"

    steps:
      - name: Download unsigned APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.unsigned_artifact_name }}
          path: ./

      - name: Move APK to root directory
        run: cp ./${INPUTS_UNSIGNED_ARTIFACT_NAME} ./owncloud-${INPUTS_VERSION}.apk
        env:
          INPUTS_UNSIGNED_ARTIFACT_NAME: ${{ inputs.unsigned_artifact_name }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Restore keystore
        run: |
          echo "${{ secrets.TEST_KS_B64 }}" | base64 -d > ./test.keystore

      - name: Align and sign APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.TEST_KS_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TEST_KS_KEY }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          APK_INPUT="owncloud-${INPUTS_VERSION}.apk"
          APK_ALIGNED="owncloud-${INPUTS_VERSION}-aligned.apk"
          APK_SIGNED="owncloudSigned-${INPUTS_VERSION}.apk"
          KEYSTORE="./test.keystore"

          echo "Aligning APK..."
          $ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/zipalign -v -p 4 "$APK_INPUT" "$APK_ALIGNED"

          echo "Signing APK..."
          $ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:"$KEY_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-type PKCS12 \
            --out "$APK_SIGNED" \
            "$APK_ALIGNED"

          $ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner verify "$APK_SIGNED"

          rm -f "$APK_ALIGNED"
          rm -f ./test.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owncloudSigned-${{ inputs.version }}
          path: ./owncloudSigned-${{ inputs.version }}.apk
          retention-days: 2
